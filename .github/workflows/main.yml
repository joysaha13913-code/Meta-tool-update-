name: Build Debug APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP_FILE=$(ls -v MetaApiAutoCreator_Android*.zip | tail -n 1)
          unzip -o "$ZIP_FILE"
          python3 -c 'p="app/src/main/java/com/metaautocreator/app/MainActivity.java"; s=open(p).read().replace("String code = TotpHelper.generateTotp(raw);", "String code = null; try { code = TotpHelper.generateTotp(raw); } catch (Exception ignored) {}"); open(p,"w").write(s)'
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MetaApiAutoCreator"
          include(":app")
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MetaApiAutoCreator-APK
          path: app/build/outputs/apk/debug/app-debug.ap      - name: Unzip project
        run: |
          ZIP_FILE=$(ls -t *.zip | head -n 1)
          unzip -o "$ZIP_FILE"
          
          
